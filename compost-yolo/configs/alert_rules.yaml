# Règles d'alerte au niveau image.
# Les classes listées ici sont considérées comme INTRUSES (tout ce qui n'est
# pas listé — ex. Organique — est ignoré par la logique d'alerte).
# Valeur = seuil de confiance minimal pour qu'une détection déclenche une alerte.
# Seuils provisoires, à calibrer avec : python scripts/evaluate.py --sweep-thresholds

intruder_thresholds:
  Plastique: 0.40
  Metal: 0.40
  Carton: 0.50
  Aluminium: 0.40
  Ceramique: 0.50
