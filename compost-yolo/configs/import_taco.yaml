# Correspondance pour TACO (fork ali-ikched de roboflow-universe-projects/
# taco-object-detection-kcxyn, version sans augmentations).
# Licence : CC BY 4.0 (attribution) pour les annotations ; images issues de
# Flickr (licences variées) — citer TACO (Proença & Simões 2020, tacodataset.org).
#
# Choix de mapping discutables, assumés ici (à documenter dans le rapport) :
# - Aerosol -> Metal (certains sprays sont en alu)
# - Drink carton -> Composite (brique Tetra Pak : carton + plastique + alu)
# - Crisp packet -> Composite (film plastique métallisé : plastique + alu)
# - Styrofoam/Foam -> Plastique (polystyrène)
# - PAPIER (Normal/Magazine/Wrapping paper, Paper bag/cup/straw, Tissues) -> null :
#   compostable, donc ignoré. Carton (cartons épais) reste un intrus.
# - Blister packs / foam pourraient aussi être Composite si besoin.

# Export Roboflow en polygones de segmentation -> convertis en boîtes à l'import
