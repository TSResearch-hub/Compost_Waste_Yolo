# Correspondance pour « proj3 Food Waste Detection » (fork ali-ikched).
# Assiettes de cantine avant/après repas — étude MDPI (Ferreira & Cerqueira,
# YOLOv11). Licence : CC BY 4.0 (attribution). url :
# https://universe.roboflow.com/project-eyfif/proj3-food-waste-detection
#
# Intérêt : domaine « restauration » (un client majeur du compost). Apporte
# surtout des COUVERTS (Metal) et de la VAISSELLE (Ceramique) en conditions
# réelles d'assiette. Les aliments sont IGNORÉS (null) : détecteur d'intrus
# uniquement, l'organique est le fond (voir configs/data.yaml).
#
# Labels au format segmentation (polygones) -> convertis en boîtes à l'import.
format: yolo-seg

# Choix de mapping discutables, assumés ici (à documenter dans le rapport) :
# - fork / knife / spoon -> Metal : couverts de cantine généralement
#   métalliques ; serait faux pour du jetable plastique (non distingué ici).
# - plate / bowl / soupbowl -> Ceramique : vaisselle de cantine (tu as demandé
#   plate -> Ceramique ; j'étends aux bols par cohérence). Pourrait être
#   mélamine/plastique selon l'établissement -> à revoir si besoin.
# - board / cup / coffee cup / water cup / water / garbage -> null : matériau
#   ambigu (verre/papier/plastique) ou catégorie fourre-tout, on ignore.

# Noms exacts du data.yaml de l'export (l'ordre = les ids 0..86)
