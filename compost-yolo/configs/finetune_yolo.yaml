# Fine-tuning YOLO (v8n / 11n / 11s...) sur les captures réelles — même split,
# même patience et même augmentation que finetune_rtdetr.yaml, pour une
# comparaison d'architectures propre. L'optimisation reste celle de référence
# YOLO (SGD, lr 0.01), chaque architecture étant entraînée avec SA recette.
# Tout ce fichier (sauf `model`) est transmis tel quel à Ultralytics.

model: yolov8n.pt      # surchargé par retrain.py --pretrain / train.py --model
epochs: 60             # petit modèle : converge plus lentement que RT-DETR-l
imgsz: 640
batch: 16
seed: 42
cache: ram             # images redimensionnées gardées en RAM (~1 Go pour 1000 images) :
                       # sans cache, les JPEG 4000x3000 sont décodés à chaque epoch
                       # (~1000 s/epoch mesurés en local sous WSL2, contre ~60 s sur Colab)
patience: 8

# --- optimisation ---------------------------------------------------------
optimizer: SGD         # explicite : 'auto' choisirait AdamW à lr 8.3e-4 sur ce volume
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true

# --- augmentation (identique à RT-DETR) -----------------------------------
hsv_h: 0.03
hsv_s: 0.7
hsv_v: 0.5
mosaic: 0.5
close_mosaic: 10
fliplr: 0.5
scale: 0.5
translate: 0.1
